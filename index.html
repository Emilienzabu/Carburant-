<!DOCTYPE html>
<html lang="fr">
<head>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CarburantRadar</title>
<meta name="theme-color" content="#f5a623">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#e8e8f0;font-family:sans-serif;padding:20px}
header{background:#16161f;border-bottom:1px solid #252535;padding:16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;margin:-20px -20px 20px}
.ico{width:36px;height:36px;background:#f5a623;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.h1{font-size:17px;font-weight:800}.h1 span{color:#f5a623}
.sub{font-size:10px;color:#6b6b8a}
button{width:100%;padding:15px;background:#f5a623;color:#000;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:12px}
.fuels,.radii{display:flex;gap:4px;background:#16161f;border:1px solid #252535;border-radius:10px;padding:4px;margin-bottom:10px;overflow-x:auto}
.fuels::-webkit-scrollbar,.radii::-webkit-scrollbar{display:none}
.fb,.rb{padding:8px 12px;border-radius:8px;background:transparent;border:none;color:#6b6b8a;font-size:12px;cursor:pointer;white-space:nowrap}
.fb.a{background:#ff6b35;color:#fff;font-weight:700}
.rb.a{background:#f5a623;color:#000;font-weight:700}
#status{display:none;background:#16161f;border:1px solid #252535;border-radius:10px;padding:10px 14px;font-size:12px;color:#6b6b8a;margin-bottom:12px}
#status.on{display:block}
.stats{display:none;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.stats.on{display:grid}
.stat{background:#16161f;border:1px solid #252535;border-radius:10px;padding:10px;text-align:center}
.sl{font-size:9px;color:#6b6b8a;text-transform:uppercase;letter-spacing:1px}
.sv{font-size:19px;font-weight:800}
.card{background:#16161f;border:1px solid #252535;border-radius:14px;padding:16px;margin-bottom:10px}
.card.best{border-color:#3ddc97}
.badge{display:inline-block;background:#3ddc97;color:#000;font-size:9px;font-weight:700;padding:2px 7px;border-radius:5px;margin-bottom:6px}
.rank{font-size:10px;color:#6b6b8a;margin-bottom:4px}
.name{font-size:15px;font-weight:700;margin-bottom:2px}
.addr{font-size:11px;color:#6b6b8a;margin-bottom:12px}
.metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px}
.m{background:#0a0a0f;border-radius:8px;padding:8px;text-align:center}
.ml{font-size:8px;color:#6b6b8a;text-transform:uppercase;margin-bottom:2px}
.mv{font-size:13px;font-weight:600}
.mv.p{color:#f5a623}.mv.d{color:#e8e8f0}.mv.s{color:#3ddc97}.mv.t{color:#a78bfa}
.bar{height:4px;background:#0a0a0f;border-radius:4px;overflow:hidden;margin-bottom:10px}
.fill{height:100%;background:linear-gradient(90deg,#3ddc97,#f5a623)}
.go{display:block;width:100%;padding:10px;background:#f5a623;color:#000;border:none;border-radius:9px;font-size:13px;font-weight:700;text-align:center;text-decoration:none}
.empty{text-align:center;padding:50px 20px;color:#6b6b8a}
.spinner{width:30px;height:30px;border:3px solid #252535;border-top-color:#f5a623;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
<div class="ico">⛽</div>
<div><div class="h1">Carburant<span>Radar</span></div><div class="sub">PRIX EN TEMPS REEL</div></div>
</header>
<button id="locBtn" onclick="locate()">Me localiser</button>
<div class="fuels" id="fg">
<button class="fb a" data-f="Gazole" onclick="sf(this)">Diesel</button>
<button class="fb" data-f="SP95" onclick="sf(this)">SP95</button>
<button class="fb" data-f="SP98" onclick="sf(this)">SP98</button>
<button class="fb" data-f="E10" onclick="sf(this)">E10</button>
<button class="fb" data-f="E85" onclick="sf(this)">E85</button>
<button class="fb" data-f="GPLc" onclick="sf(this)">GPL</button>
</div>
<div class="radii" id="rg">
<button class="rb a" data-k="5" onclick="sr(this)">5 km</button>
<button class="rb" data-k="10" onclick="sr(this)">10 km</button>
<button class="rb" data-k="20" onclick="sr(this)">20 km</button>
<button class="rb" data-k="50" onclick="sr(this)">50 km</button>
</div>
<div id="status"></div>
<div class="stats" id="stats">
<div class="stat"><div class="sl">Stations</div><div class="sv" id="sc" style="color:#f5a623">0</div></div>
<div class="stat"><div class="sl">Prix min</div><div class="sv" id="sm" style="color:#3ddc97">0</div></div>
<div class="stat"><div class="sl">Prix moy</div><div class="sv" id="sa" style="color:#ff6b35">0</div></div>
</div>
<div id="content">
<div class="empty">
<div style="font-size:40px;margin-bottom:10px">⛽</div>
<div style="font-size:16px;font-weight:700;color:#e8e8f0;margin-bottom:6px">Pret a demarrer</div>
<div style="font-size:13px">Appuie sur Me localiser</div>
</div>
</div>
<script>
var la=null,lo=null,fu="Gazole",ra=5,st=[];
var PK={Gazole:"gazole_prix",SP95:"sp95_prix",SP98:"sp98_prix",E10:"e10_prix",E85:"e85_prix",GPLc:"gplc_prix"};
var FL={Gazole:"Diesel",SP95:"SP95",SP98:"SP98",E10:"E10",E85:"E85",GPLc:"GPL"};
var PROXY="https://carburant-proxy.emilienzabukovec09.workers.dev";
var OSRM="https://router.project-osrm.org/table/v1/driving/";

function ss(m){var e=document.getElementById("status");e.textContent=m;e.className="on";}
function sc(h){document.getElementById("content").innerHTML=h;}

function sf(b){
  var btns=document.querySelectorAll(".fb");
  for(var i=0;i<btns.length;i++) btns[i].classList.remove("a");
  b.classList.add("a");fu=b.dataset.f;
  if(st.length>0) render();
}

function sr(b){
  var btns=document.querySelectorAll(".rb");
  for(var i=0;i<btns.length;i++) btns[i].classList.remove("a");
  b.classList.add("a");ra=parseInt(b.dataset.k);
  if(la!=null) load();
}

function hv(a,b,c,d){
  var R=6371,dL=(c-a)*Math.PI/180,dO=(d-b)*Math.PI/180;
  var x=Math.sin(dL/2)*Math.sin(dL/2)+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dO/2)*Math.sin(dO/2);
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

function fmtTime(sec){
  if(sec<60) return sec+"s";
  var m=Math.round(sec/60);
  if(m<60) return m+" min";
  return Math.floor(m/60)+"h"+String(m%60).padStart(2,"0");
}

function locate(){
  var btn=document.getElementById("locBtn");
  btn.disabled=true;btn.textContent="Localisation...";ss("Acces a ta position...");
  if(!navigator.geolocation){ss("Erreur geolocalisation");btn.disabled=false;btn.textContent="Me localiser";return;}
  navigator.geolocation.getCurrentPosition(
    function(p){la=p.coords.latitude;lo=p.coords.longitude;btn.textContent="Actualiser";btn.disabled=false;load();},
    function(){ss("Erreur - verifie les permissions");btn.disabled=false;btn.textContent="Me localiser";},
    {enableHighAccuracy:true,timeout:12000}
  );
}

function load(){
  ss("Chargement des prix...");
  sc('<div class="empty"><div class="spinner"></div><div style="font-size:14px;color:#e8e8f0">Recherche en cours...</div></div>');
  document.getElementById("stats").className="stats";
  var url=PROXY+"?lat="+la+"&lon="+lo+"&dist="+ra+"&limit=100";
  fetch(url).then(function(r){
    if(!r.ok) throw new Error("erreur");
    return r.json();
  }).then(function(raw){
    if(!raw||!Array.isArray(raw.results)) throw new Error("pas de resultats");
    st=[];
    for(var i=0;i<raw.results.length;i++){
      var r=raw.results[i];
      var rl=r.geom?r.geom.lat:parseFloat(r.latitude)/100000;
      var rn=r.geom?r.geom.lon:parseFloat(r.longitude)/100000;
      var px=parseFloat(r[PK[fu]]);
      var dist=hv(la,lo,rl,rn);
      st.push({id:r.id,adresse:r.adresse||"",ville:r.ville||"",cp:r.cp||"",lat:rl,lon:rn,prix:isNaN(px)?null:px,distance:dist,duree:null});
    }
    // Trier par prix, garder les 10 meilleures avec un prix
    var avecPrix=st.filter(function(s){return s.prix>0;});
    avecPrix.sort(function(a,b){return a.prix-b.prix;});
    var top10=avecPrix.slice(0,10);
    ss("Calcul des temps de trajet...");
    fetchOSRM(top10);
  }).catch(function(){
    ss("Erreur - verifie ta connexion");
    sc('<div class="empty"><div style="font-size:30px">!</div><div style="color:#e8e8f0;font-weight:700;margin:8px 0">Erreur</div><div style="font-size:13px">Actualise pour reessayer</div></div>');
  });
}

function fetchOSRM(top10){
  // Construire la requête OSRM table: position + destinations
  var coords=lo+","+la+";"+top10.map(function(s){return s.lon+","+s.lat;}).join(";");
  var osrmUrl=OSRM+coords+"?sources=0&annotations=duration,distance";
  fetch(osrmUrl).then(function(r){return r.json();}).then(function(data){
    var durations=data.durations?data.durations[0]:null;
    var distances=data.distances?data.distances[0]:null;
    for(var i=0;i<top10.length;i++){
      // index i+1 car source=0 est notre position
      top10[i].duree=durations?(durations[i+1]||null):null;
      top10[i].distRoute=distances?(distances[i+1]||null):null;
    }
    // Mettre à jour st avec les données OSRM
    for(var i=0;i<top10.length;i++){
      for(var j=0;j<st.length;j++){
        if(st[j].id===top10[i].id){
          st[j].duree=top10[i].duree;
          st[j].distRoute=top10[i].distRoute;
        }
      }
    }
    render();
  }).catch(function(){
    // Si OSRM échoue, on affiche quand même les résultats sans temps
    render();
  });
}

function render(){
  var wp=st.filter(function(s){return s.prix>0;});
  var np=st.filter(function(s){return !s.prix||s.prix<=0;});
  var ps=wp.map(function(s){return s.prix;});
  var mnP=Math.min.apply(null,ps),mxP=Math.max.apply(null,ps);

  // Pour le score: utiliser duree si dispo, sinon distance vol d'oiseau
  var ts=wp.map(function(s){return s.duree!==null?s.duree:s.distance*120;});// ~120s/km estimé
  var mnT=Math.min.apply(null,ts),mxT=Math.max.apply(null,ts);

  var sc2=wp.map(function(s,i){
    var nP=mxP===mnP?0:(s.prix-mnP)/(mxP-mnP);
    var t=s.duree!==null?s.duree:s.distance*120;
    var nT=mxT===mnT?0:(t-mnT)/(mxT-mnT);
    return {
      id:s.id,adresse:s.adresse,ville:s.ville,cp:s.cp,lat:s.lat,lon:s.lon,
      prix:s.prix,distance:s.distance,duree:s.duree,distRoute:s.distRoute||null,
      score:Math.round((1-(nP*0.75+nT*0.25))*100)
    };
  });
  sc2.sort(function(a,b){return b.score-a.score;});
  var all=sc2.concat(np.map(function(s){
    return {id:s.id,adresse:s.adresse,ville:s.ville,cp:s.cp,lat:s.lat,lon:s.lon,prix:s.prix,distance:s.distance,duree:null,distRoute:null,score:null};
  }));

  if(all.length===0){
    ss("Aucune station dans "+ra+" km");
    sc('<div class="empty"><div style="font-size:30px">?</div><div style="color:#e8e8f0;font-weight:700;margin:8px 0">Aucune station</div><div style="font-size:13px">Augmente le rayon</div></div>');
    return;
  }

  if(ps.length>0){
    document.getElementById("sc").textContent=all.length;
    document.getElementById("sm").textContent=mnP.toFixed(3)+" EUR";
    document.getElementById("sa").textContent=(ps.reduce(function(a,b){return a+b;},0)/ps.length).toFixed(3)+" EUR";
    document.getElementById("stats").className="stats on";
  }

  ss(all.length+" stations - "+FL[fu]+" - "+ra+" km OK");
  var html="";
  for(var i=0;i<all.length;i++){
    var s=all[i];
    var best=(i===0&&s.score!==null);
    // Distance: routière si dispo, sinon vol d'oiseau
    var distTxt;
    if(s.distRoute!==null){
      distTxt=s.distRoute<1000?(Math.round(s.distRoute)+" m"):(( s.distRoute/1000).toFixed(1)+" km");
    } else {
      distTxt=s.distance<1?(Math.round(s.distance*1000)+" m"):(s.distance.toFixed(1)+" km");
    }
    var dureeTxt=s.duree!==null?fmtTime(s.duree):"--";
    var prix=s.prix?(s.prix.toFixed(3)+" EUR"):"N/A";
    var maps="https://www.google.com/maps/dir/?api=1&origin="+la+","+lo+"&destination="+s.lat+","+s.lon+"&travelmode=driving";
    html+='<div class="card'+(best?" best":"")+'">'+
      (best?'<div class="badge">MEILLEUR RATIO</div><br>':'')+
      '<div class="rank">#'+(i+1)+(s.score!==null?" - SCORE "+s.score+"/100":"")+'</div>'+
      '<div class="name">'+s.adresse+'</div>'+
      '<div class="addr">'+s.cp+' '+s.ville+'</div>'+
      '<div class="metrics">'+
      '<div class="m"><div class="ml">Prix/L</div><div class="mv p">'+prix+'</div></div>'+
      '<div class="m"><div class="ml">Distance</div><div class="mv d">'+distTxt+'</div></div>'+
      '<div class="m"><div class="ml">Temps</div><div class="mv t">'+dureeTxt+'</div></div>'+
      '</div>'+
      '<div class="metrics">'+
      '<div class="m" style="grid-column:span 3"><div class="ml">Score</div><div class="mv s">'+(s.score!==null?s.score+"/100":"--")+'</div></div>'+
      '</div>'+
      (s.score!==null?'<div class="bar"><div class="fill" style="width:'+s.score+'%"></div></div>':'')+
      '<a class="go" href="'+maps+'" target="_blank">Y aller</a>'+
      '</div>';
  }
  sc(html);
}
</script>
</body>
</html>
